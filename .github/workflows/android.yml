# Builds an installable Android APK. Run it from the Actions tab ("Run workflow") or by pushing a tag like v0.1.0.
# The APK appears under the run's Artifacts, and on the Releases page for tagged builds.
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Ubuntu runner already ships the Android SDK; only the NDK and one platform are added.
      - name: Install the Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          ls "$ANDROID_SDK_ROOT/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate the Android project
        run: |
          cargo tauri icon src-tauri/app-icon.png
          cargo tauri android init
          python3 scripts/android-setup.py

      # A stable signing key lets new builds install over old ones. Without the secrets a throwaway key is
      # used: the APK still installs, but each new build needs the old one uninstalled first.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sleeve.jks"
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret set; signing with a throwaway key."
            keytool -genkeypair -keystore "$RUNNER_TEMP/sleeve.jks" -storepass sleeve-temp -keypass sleeve-temp -alias sleeve \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sleeve"
            echo "KS_PASS=sleeve-temp" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cargo tauri android build --apk --target aarch64 --target armv7

      - name: Sign
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          "$TOOLS/zipalign" -f 4 "$APK" aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/sleeve.jks" --ks-pass "pass:$KS_PASS" --ks-key-alias sleeve --out Sleeve.apk aligned.apk
          "$TOOLS/apksigner" verify --print-certs Sleeve.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: Sleeve-android
          path: Sleeve.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Sleeve.apk
