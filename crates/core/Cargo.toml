[package]
name = "sleeve-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
getrandom = "0.2"
lofty = "0.22"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
tiny_http = "0.12"
walkdir = "2"

[[bin]]
name = "sleeve-dev"
path = "src/bin/dev.rs"
